# yatr - https://github.com/cargopete/yatr
#
# These tasks are what .github/workflows CI runs, command for command, so
# `yatr ci` locally is the same gate. The workflow calls these tasks by name:
# change a command here and CI changes with it.
#
# The aggregate is `ci`, not `check`: `yatr check` is a builtin that validates
# this file and shadows any task of that name without warning.

[env]
CARGO_TERM_COLOR = "always"

[settings]
cache = true
watch_debounce_ms = 200

[tasks.fmt]
desc = "Format the tree"
run = ["cargo fmt --all"]
no_cache = true

[tasks.fmt-check]
desc = "Fail if the tree is unformatted (CI: rustfmt)"
run = ["cargo fmt --all --check"]
sources = ["**/*.rs"]

[tasks.lint]
desc = "Clippy with warnings denied (CI: clippy)"
run = ["cargo clippy --workspace --all-targets -- -D warnings"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock"]

[tasks.test]
desc = "Run the test suite (CI: test)"
run = ["cargo test --workspace"]
# The codegen snapshot tests read examples/ and the insta .snap files.
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock", "crates/**", "examples/**"]
watch = ["**/*.rs"]

[tasks.build]
desc = "Build in release mode"
run = ["cargo build --workspace --release"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock"]

[tasks.doc]
desc = "Build the API docs"
run = ["cargo doc --workspace --no-deps"]
sources = ["**/*.rs"]

[tasks.conformance]
desc = "Eject-path proof for one example: redstart build then graph codegen/build"
run = ["./conformance/run.sh build"]
env = { PROJECT = "examples/erc20" }
no_cache = true

[tasks.ci]
desc = "What the CI check job runs: fmt-check, lint, test"
depends = ["fmt-check", "lint", "test"]
run = []
